<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design & Build with AI</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #1a1a1a;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            color: #888888;
        }
    </style>
</head>
<body>
    <main>
        <h1>Design &amp; Build with AI</h1>
        <p>Coming soon</p>
    </main>
</body>
</html>
